    <script>
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("snapserve-theme");
          if (stored === "dark" || stored === "light") theme = stored;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#050607" : "#ffffff");
      })();
    </script>
