<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <link rel="alternate" type="text/plain" href="https://snapserve.ai/llms.txt" title="LLM site summary" />
    <!-- Lean bootstrap graph for non-JS crawlers. React Seo replaces with the full on-page graph. -->
    <script type="application/ld+json" id="jsonld-bootstrap">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://snapserve.ai/#organization",
          "name": "SnapServe",
          "url": "https://snapserve.ai",
          "logo": "https://snapserve.ai/logos/logo-full-light.png",
          "email": "support@snapserve.ai"
        },
        {
          "@type": "WebSite",
          "@id": "https://snapserve.ai/#website",
          "name": "SnapServe",
          "url": "https://snapserve.ai",
          "publisher": { "@id": "https://snapserve.ai/#organization" }
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://snapserve.ai/#software",
          "name": "SnapServe",
          "applicationCategory": "BusinessApplication",
          "applicationSubCategory": "AI Voice Agent Platform",
          "operatingSystem": "Web",
          "url": "https://snapserve.ai",
          "description": "AI voice agent platform and orchestration layer with caller memory, auto-redial, meeting bots, multi-provider ASR/LLM/TTS, campaigns, and CRM write-back."
        }
      ]
    }
    </script>
    <meta property="og:title" content="SnapServe — AI Voice Agent Platform & Orchestration Layer" />
    <meta property="og:description" content="Deploy AI voice agents that actually work — multi-provider orchestration, caller memory, auto-redial, meeting bots, and CRM write-back. Pay per minute." />
    <meta property="og:url" content="https://snapserve.ai/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://snapserve.ai/images/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="SnapServe" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SnapServe — AI Voice Agent Platform & Orchestration Layer" />
    <meta name="twitter:description" content="Multi-provider voice AI with memory, auto-redial, meeting bots, and CRM write-back. Pay per minute." />
    <meta name="twitter:image" content="https://snapserve.ai/images/og-card.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700&family=Roboto:wght@400;500&family=Sora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var dark = false;
        try {
          dark = localStorage.getItem("snapserve-theme") === "dark";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#050607" : "#ffffff");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
